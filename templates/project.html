<h2>Project {{ project_number }}</h2>

<form action="/projects/add_employee_to_project" method="POST">
    <input type="hidden" name="project_number" value="{{ project_number }}">

    <label for="employee">Employee:</label>
    <select id="employee" name="employee_ssn" required>
        {% for ssn, name in employees %}
            <option value="{{ ssn }}">{{ name }}</option>
        {% endfor %}
    </select>

    <input type="number" name="hours" placeholder="Hours" min="0" step="1" required>
    <button type="submit">Add Hours To Employee</button>
</form>

<table>
    <thead>
        <tr>
            <th>Employee Name</th>
            <th>Hours</th>
        </tr>
    </thead>
    <tbody>
        {% for name, hours in data %}
        <tr>
            <td>{{ name }}</td>
            <td>{{ hours }}</td>
        </tr>
        {% else %}
        <tr>
            <td colspan="2">No employees assigned to this project.</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
