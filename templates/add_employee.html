<h1>Add New Employee</h1>
<form action="/employees/add" method="POST">
    <input type="text" name="ssn" placeholder="SSN" required>
    <input type="text" name="fname" placeholder="First Name" required>
    <input type="text" name="minit" placeholder="Middle Initial">
    <input type="text" name="lname" placeholder="Last Name" required>
    <input type="text" name="address" placeholder="Address" required>
    <input type="text" name="sex" placeholder="Sex" required>
    <input type="number" name="salary" placeholder="Salary" required>
    <input type="number" name="dno" placeholder="Department Number" required>
    <button type="submit">Add Employee</button>
</form>

{% if error %}
<p style="color:red;">{{ error }}</p>
{% endif %}
